# Seed registry: company name -> career-board source(s).
#
# This is a best-effort starter list, not a live-verified one - board tokens
# occasionally change when a company migrates ATS, and this file was written
# from training knowledge rather than a live probe (see README: "Accuracy of
# the seed registry"). A stale token fails loudly (a SourceReport error in the
# report) rather than silently - it never looks like "this company has no
# jobs" when the real problem is "this token is wrong".
#
# To add a company:
#   1. Visit its careers page and find the underlying board. The tell is the
#      URL: boards.greenhouse.io/{token}, jobs.lever.co/{token},
#      jobs.ashbyhq.com/{token}, {tenant}.wdN.myworkdayjobs.com/.../{site}.
#   2. Add an entry below (or to your own overrides file - see README).
#
# True FAANG-scale in-house career sites (Google, Meta, Apple, Amazon
# corporate, Netflix) do not run on any of these third-party boards and have
# no public API this tool can call - they are intentionally left out rather
# than pointed at guessed endpoints. Everything else in tech mostly does.

companies:
  - name: Stripe
    aliases: [stripe]
    sources:
      - provider: greenhouse
        config: {board: stripe}

  - name: Airbnb
    aliases: [airbnb]
    sources:
      - provider: greenhouse
        config: {board: airbnb}

