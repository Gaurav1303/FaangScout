# Diagnostic targets for scripts/probe.py - read by the "Probe" workflow step.
# Delete this file once the findings are applied; the step is skipped without it.

# NVIDIA matched 0 "software engineer" jobs in 24h despite a healthy board.
# Is Workday's search relevance-ordered (so recent postings sit past the
# pages fetched)? Look at total and the postedOn of the first page.
- {name: nvidia workday search, method: POST, limit: 2500,
   url: "https://nvidia.wd5.myworkdayjobs.com/wday/cxs/nvidia/NVIDIAExternalCareerSite/jobs",
   json: {appliedFacets: {}, limit: 20, offset: 0, searchText: "software engineer"}}
- {name: nvidia workday no-search, method: POST, limit: 1500,
   url: "https://nvidia.wd5.myworkdayjobs.com/wday/cxs/nvidia/NVIDIAExternalCareerSite/jobs",
   json: {appliedFacets: {}, limit: 20, offset: 0, searchText: ""}}
