# Diagnostic targets for scripts/probe.py - read by the "Probe" workflow step.
# Delete this file once the findings are applied; the step is skipped without it.
# Round 3: exact row markup and paging for the new HTML/JSON job sources.

- name: PhonePe public
  kind: items
  url: https://www.phonepe.com/apollo/job-postings/latest.json
  path: results
  where:
    status: PUBLIC
  count: 2
  limit: 700
- name: Rippling ATS shape
  kind: shape
  depth: 3
  url: https://ats.rippling.com/api/v2/board/rippling/jobs
- name: Rippling ATS page 2
  kind: shape
  depth: 2
  url: https://ats.rippling.com/api/v2/board/rippling/jobs?page=1&pageSize=50
- name: Nutanix list rows
  kind: around
  url: https://jobs.jobvite.com/nutanix/jobs
  pattern: jv-job-list-name|<tr
  context: 300
  count: 3
- name: Intuit row full
  kind: around
  url: https://jobs.intuit.com/search-jobs/software%20engineer
  pattern: <h2>[^<]+</h2>
  context: 700
  count: 2
- name: Intuit paging
  kind: around
  url: https://jobs.intuit.com/search-jobs/software%20engineer
  pattern: pagination|data-total-pages|next
  context: 200
  count: 3
- name: Apple row full
  kind: around
  url: https://jobs.apple.com/en-in/search?search=software%20engineer&sort=newest&location=india-INDC
  pattern: <h3><a class="link-inline
  context: 900
  count: 2
- name: Apple paging
  kind: around
  url: https://jobs.apple.com/en-in/search?search=software%20engineer&sort=newest&location=india-INDC
  pattern: page=2|pagination|of \d+ results|resultCount|totalRecords
  context: 150
  count: 3
