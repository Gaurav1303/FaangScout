- kind: items
  name: Swiggy fields
  method: POST
  url: https://swiggy.mynexthire.com/employer/careers/reqlist/get
  json:
    source: careers
    code: ''
    filterByBuId: -1
  path: reqDetailsBOList
  count: 1
  limit: 12000
  where:
    buName: Technology
  distinct: buName
- kind: around
  name: Swiggy job link on careers page
  url: https://careers.swiggy.com/
  pattern: mynexthire|reqId|jobs\?
  count: 4
  context: 300
- kind: around
  name: Google card location
  url: https://www.google.com/about/careers/applications/jobs/results/?location=India&q=software%20engineer&sort_by=date
  pattern: place</i>|India</span>|Bengaluru|Hyderabad
  count: 4
  context: 700
- kind: around
  name: Google card start
  url: https://www.google.com/about/careers/applications/jobs/results/?location=India&q=software%20engineer&sort_by=date
  pattern: <h3
  count: 2
  context: 1200
- kind: around
  name: PAN India path
  url: https://jobs.paloaltonetworks.com/en/search-jobs/software%20engineer/India
  pattern: data-total-results=\"\d+\"|section29__result-location[^<]*<
  count: 4
  context: 80
- kind: around
  name: PAN page 2
  url: https://jobs.paloaltonetworks.com/en/search-jobs/software%20engineer?p=2
  pattern: data-current-page=\"\d+\"|href=\"/en/job/[^\"]+\"
  count: 3
  context: 40
- kind: around
  name: Goldman role page
  url: https://higher.gs.com/roles/154399
  pattern: descriptionHtml|__NEXT_DATA__|years
  count: 4
  context: 300
- kind: raw
  name: Goldman GraphQL India
  method: POST
  url: https://api-higher.gs.com/gateway/api/v1/graphql
  json:
    operationName: GetRoles
    variables:
      searchQueryInput:
        page:
          pageSize: 3
          pageNumber: 0
        sort:
          sortStrategy: POSTED_DATE
          sortOrder: DESC
        filters:
        - filterCategoryType: LOCATION
          filters:
          - filter: India
            subFilters: []
        experiences:
        - EARLY_CAREER
        - PROFESSIONAL
        searchTerm: software engineer
    query: 'query GetRoles($searchQueryInput: RoleSearchQueryInput!) { roleSearch(searchQueryInput:
      $searchQueryInput) { totalCount items { roleId corporateTitle jobTitle jobFunction
      locations { primary state country city } status division externalSource { sourceId
      } } } }'
  limit: 1500
